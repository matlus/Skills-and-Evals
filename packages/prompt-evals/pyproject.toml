[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-evals"
version = "0.1.0"
description = "Prompt Evals library."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["prompt_evals*"]
namespaces = false

[tool.setuptools.package-data]
"prompt_evals" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
pythonpath = ["src", "tests"]
markers = [
    "acceptance: black-box tests through the DomainFacade with the Claude CLI wire replaced by a spy",
    "class_test: deterministic tests of one class, such as a grader",
]